services:
  - type: web
    name: autonomous-agent-beacon
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: BEACON_SECRET_KEY
        generateValue: true
      - key: ADMIN_SECRET_TOKEN
        generateValue: true
      - key: DISCORD_WEBHOOK_URL
        value: https://discord.com/api/webhooks/1557126832153960570/if-0cS_GQRrqCVG--aYQTa1gR0-jkx9uWNGhlxlQ1Myq3GU7eZMpKzN8bDRh-k5Lrjub
      - key: CHALLENGE_TIMEOUT_SECONDS
        value: "3.0"
      - key: MAX_BODY_SIZE_BYTES
        value: "16384"
      - key: DATABASE_URL
        value: sqlite:///./beacon.db
